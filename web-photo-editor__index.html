<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17191d" />
  <title>Web Photo Editor</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">W</span>
        <span class="brand-name">Web Photo Editor</span>
      </div>
      <nav id="menuBar" class="menu-bar" aria-label="Application menu"></nav>
      <div class="top-actions">
        <button id="newBtn" class="ghost-btn" title="New document">New</button>
        <button id="openBtn" class="ghost-btn" title="Open image">Open</button>
        <button id="saveBtn" class="ghost-btn" title="Save project">Save</button>
        <button id="exportBtn" class="primary-btn" title="Export image">Export</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="toolbar panel" id="toolbar"></aside>

      <main class="stage-shell">
        <div class="optionsbar" id="optionsBar"></div>
        <div class="stage-wrap" id="stageWrap">
          <div class="ruler ruler-top" id="rulerTop"></div>
          <div class="ruler ruler-left" id="rulerLeft"></div>
          <div class="canvas-holder" id="canvasHolder">
            <canvas id="displayCanvas"></canvas>
            <canvas id="interactionCanvas"></canvas>
          </div>
          <div id="emptyHint" class="empty-hint">
            <strong>Start editing</strong>
            <span>Open an image or create a new document.</span>
          </div>
        </div>
        <div class="statusbar" id="statusBar"></div>
      </main>

      <aside class="right-dock" id="rightDock">
        <section class="dock-panel">
          <div class="dock-title">Color</div>
          <div class="color-controls">
            <label>Foreground <input id="fgColor" type="color" value="#111111" /></label>
            <label>Background <input id="bgColor" type="color" value="#ffffff" /></label>
            <button id="swapColors" class="small-btn">Swap</button>
          </div>
        </section>

        <section class="dock-panel">
          <div class="dock-title row-between"><span>History</span><span id="historyCount">0</span></div>
          <div id="historyList" class="history-list"></div>
        </section>

        <section class="dock-panel layers-panel">
          <div class="dock-title row-between">
            <span>Layers</span>
            <div class="icon-actions">
              <button id="addLayerBtn" class="mini-icon" title="New layer">＋</button>
              <button id="duplicateLayerBtn" class="mini-icon" title="Duplicate layer">⧉</button>
              <button id="deleteLayerBtn" class="mini-icon" title="Delete layer">⌫</button>
            </div>
          </div>
          <div class="layer-properties">
            <label>Opacity <input id="opacitySlider" type="range" min="0" max="100" value="100" /><span id="opacityValue">100%</span></label>
            <label>Blend
              <select id="blendMode">
                <option value="source-over">Normal</option>
                <option value="multiply">Multiply</option>
                <option value="screen">Screen</option>
                <option value="overlay">Overlay</option>
                <option value="darken">Darken</option>
                <option value="lighten">Lighten</option>
                <option value="color-dodge">Color Dodge</option>
                <option value="color-burn">Color Burn</option>
                <option value="hard-light">Hard Light</option>
                <option value="soft-light">Soft Light</option>
                <option value="difference">Difference</option>
                <option value="exclusion">Exclusion</option>
              </select>
            </label>
          </div>
          <div id="layerList" class="layer-list"></div>
        </section>
      </aside>
    </div>
  </div>

  <div id="modalRoot" class="modal-root hidden"></div>
  <input id="imageFileInput" type="file" accept="image/*" hidden />
  <input id="projectFileInput" type="file" accept="application/json,.wpe" hidden />
  <script type="module" src="./src/app.js"></script>
</body>
</html>
